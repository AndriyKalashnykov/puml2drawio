name: 'puml2drawio'
description: 'Convert PlantUML C4 diagrams to draw.io XML (wraps the catalyst library).'
author: 'Andriy Kalashnykov'
branding:
  icon: 'git-merge'
  color: 'blue'

inputs:
  input:
    description: 'Input .puml file, directory (recursed), glob pattern, or "-" for stdin'
    required: true
  output:
    description: 'Output file (single input) or directory (batch)'
    required: false
  output-ext:
    description: 'Output file extension (batch/glob; single-file when output is a directory). Not applied to stdin.'
    required: false
    default: '.drawio'
  layout-direction:
    description: 'Layout direction: TB | BT | LR | RL'
    required: false
  nodesep:
    description: 'Node separation (px)'
    required: false
  edgesep:
    description: 'Edge separation (px)'
    required: false
  ranksep:
    description: 'Rank separation (px)'
    required: false
  marginx:
    description: 'X margin (px)'
    required: false
  marginy:
    description: 'Y margin (px)'
    required: false
  fail-fast:
    description: 'Stop on first batch conversion error (true | false)'
    required: false
    default: 'false'
  quiet:
    description: 'Suppress per-file progress output (true | false)'
    required: false
    default: 'false'
  summary:
    description: 'Emit a JSON conversion summary (true | false). Batch/glob: to stdout; single/stdin: to stderr'
    required: false
    default: 'false'

runs:
  using: 'docker'
  # Pin to the published major-version tag — auto-rolls forward to the latest
  # 1.x.y release (Renovate tracks new major bumps via the docker manager).
  # Consumers pull a ~12 MB image instead of building from source on first use
  # (~30-60 s saved per consumer per CI run). Cosign-verifiable supply chain.
  image: 'docker://ghcr.io/andriykalashnykov/puml2drawio:1'
  entrypoint: '/app/action-entrypoint.sh'
