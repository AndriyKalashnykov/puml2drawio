name: CI

on:
  push:
    branches: [main]
    # Only full-semver tags (vN.N.N) trigger the publish pipeline.
    # Floating major/minor tags (v1, v1.0) are pushed manually after a
    # release to retarget consumers' `uses: ...@v1` and MUST NOT
    # re-trigger publish. See `make release-floating-tags`.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` is required by dorny/paths-filter on pull_request
# events so the action can list the PR's changed files. `contents: read`
# covers checkout on push/tag events.
permissions:
  contents: read
  pull-requests: read

env:
  # Some pinned actions (e.g. aquasecurity/trivy-action transitively pulls
  # actions/cache@v4.2.4) still ship on Node.js 20. GitHub deprecated Node 20
  # for runner-side JS actions in 2025-09; opt into Node 24 now to silence the
  # deprecation warning. Safe to remove once every transitive dep ships Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  # Detect whether the push/PR touches code-shaped files. Doc-only changes
  # skip the heavy jobs but still allow `ci-pass` to report a green status
  # — required by the repository ruleset that gates merges on `ci-pass`.
  # The `code` output is force-true on tag pushes so the publish pipeline
  # always runs for a v* tag (paths-filter's diff against an empty base
  # returns no changes for tag refs).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          # Positive allow-list of code-bearing paths. Touching anything in
          # this list flips `code=true`; doc/asset-only changes (README.md,
          # LICENSE, .gitignore, etc.) leave it false and skip the heavy
          # jobs. CLAUDE.md is included because mermaid-lint reads it.
          # An explicit list is safer than glob-negation re-includes,
          # which behave inconsistently across picomatch versions.
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'sample/**'
              - '.github/workflows/**'
              - 'action.yml'
              - 'CATALYST_REF'
              - 'CLAUDE.md'
              - 'Dockerfile'
              - 'Makefile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'renovate.json'
              - 'vitest.config.mjs'
              - 'vitest.integration.config.mjs'
              - '.mise.toml'
              - '.nvmrc'
              - '.dockerignore'

  static-check:
    needs: [changes]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Two provisioners, one Node source of truth. `.mise.toml` no longer
      # pins `node`; the idiomatic-version-file setting makes mise read
      # `.nvmrc`, exactly like setup-node's `node-version-file: '.nvmrc'`.
      # So both paths resolve the same Node — no drift. The split is
      # intentional: mise-action provides the static-analysis tools
      # (hadolint, trivy, shellcheck) used only by `make static-check`;
      # setup-node provides the pnpm dependency cache. Downstream jobs
      # (build/test/integration-test/e2e) don't need the mise tools, so
      # they run setup-node only — `make deps` skips `mise install` when
      # mise is absent.
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: make deps

      - name: Static check
        run: make static-check

  build:
    needs: [changes, static-check]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Build
        run: make build

  test:
    needs: [changes, static-check]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: make deps

      - name: Test with coverage
        run: make test-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration-test:
    needs: [changes, static-check]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: make deps

      - name: Integration test
        run: make integration-test

      - name: Run action entrypoint test
        run: make action-test

  e2e:
    needs: [changes, build, test]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Run end-to-end tests
        run: make e2e

      # Docker BATCH path (bind mount + non-root host-owned writes) that the
      # stdin-mode `make e2e` cannot cover. Invoked here directly on the real
      # runner — NOT via `make ci-run`/act (nested bind mounts are unreliable
      # there). Closes the long-standing batch-mode e2e coverage gap.
      - name: Run end-to-end batch test
        run: make e2e-batch

      # Guards the user-facing convert-png feature (drawio + PNG side-by-side,
      # host-owned chown-back). Direct on the runner — drawio-export is an
      # Electron image; not act-friendly.
      - name: Run end-to-end convert-png test
        run: make e2e-convert-png

  docker:
    needs: [changes, static-check, build, test]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # exercised only by the tag-gated "Build and push" step
      id-token: write   # exercised only by the tag-gated cosign keyless-sign step
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Read CATALYST_REF
        id: catalyst
        run: echo "ref=$(tr -d '[:space:]' < CATALYST_REF)" >> "$GITHUB_OUTPUT"

      # CATALYST_REPO mirrors the fetch-catalyst.sh / Dockerfile default —
      # AndriyKalashnykov/catalyst is the canonical catalyst repo. Passed
      # explicitly so the docker build arg matches the host-side clone.
      - name: Set CATALYST_REPO
        id: catalyst_repo
        run: echo "repo=https://github.com/AndriyKalashnykov/catalyst.git" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build image for scan
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: puml2drawio:scan
          build-args: |
            CATALYST_REPO=${{ steps.catalyst_repo.outputs.repo }}
            CATALYST_REF=${{ steps.catalyst.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'puml2drawio:scan'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test
        run: |
          set -euo pipefail
          version=$(docker run --rm puml2drawio:scan --version)
          echo "CLI version: ${version}"
          [ -n "${version}" ] || { echo 'empty --version output' >&2; exit 1; }

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CATALYST_REPO=${{ steps.catalyst_repo.outputs.repo }}
            CATALYST_REF=${{ steps.catalyst.outputs.ref }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      # SBOM as a SEPARATE cosign attestation (NOT buildkit in-manifest:
      # sbom:false above is deliberate so the GHCR "OS / Arch" tab keeps
      # rendering). The attestation is a distinct OCI ref discoverable via
      # `cosign download attestation <image>@<digest>` / `cosign verify-attestation`.
      - name: Resolve lowercased image ref
        id: imgref
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # GHCR rejects a mixed-case path (github.repository is AndriyKalashnykov/...);
          # docker/metadata-action lowercases its own tags, so mirror that here.
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=${repo}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX-JSON)
        if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.imgref.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM with cosign
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Keyless (ambient OIDC) — same mechanism as the sign step above;
          # cosign v2+ defaults to keyless, no COSIGN_EXPERIMENTAL needed.
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${{ steps.imgref.outputs.ref }}"

      - name: Verify multi-arch manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=$(echo "${TAGS}" | head -n1)
          [ -n "${first_tag}" ] || { echo 'no tags to verify' >&2; exit 1; }
          echo "Inspecting ${first_tag}..."
          docker buildx imagetools inspect "${first_tag}"

  ci-pass:
    if: always()
    needs: [changes, static-check, build, test, integration-test, e2e, docker]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      # Treat `skipped` as OK — doc-only changes legitimately skip the
      # heavy jobs via the `changes` gate. Fail only on `failure` or
      # `cancelled`. `contains(needs.*.result, 'failure')` alone would
      # let a `cancelled` job slip through (silent-skip trap).
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
