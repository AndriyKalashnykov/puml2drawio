name: Action consumer test

# Nightly self-consumer test: exercises the action via `uses: ./`.
#
# catalyst is a C4-PlantUML converter and DELIBERATELY fail-louds on input
# it does not support (raw PlantUML with no C4 macros → "zero convertible
# C4 elements"; C4_Sequence/sequence diagrams → "unsupported diagram
# type"). A self-consumer test therefore MUST feed it inputs from its
# actual supported contract — generic/uncurated PlantUML fixtures make the
# tool correctly fail-loud on the test's OWN fixtures (self-inflicted red).
#
# So this workflow asserts BOTH contracts:
#   1. supported path  — valid C4 fixtures convert to drawio (assert output)
#   2. unsupported path — a sequence diagram with skip-unsupported:'true'
#                         is loudly skipped, batch still exits 0, and the
#                         valid sibling still converts
#
# Runs nightly + manual dispatch; not on ci-pass (it rebuilds the image).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: action-consumer-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uses-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Create test PlantUML input
        run: |
          mkdir -p test-diagrams/nested test-mixed/nested
          # Pre-create the output dirs with open perms so the container's
          # non-root `app` user (UID 10001) can write into the runner-owned
          # workspace mount (the CLI's `mkdir` would otherwise EACCES).
          mkdir -p test-output test-mixed-output
          chmod 777 test-output test-mixed-output

          # --- supported contract: valid C4-PlantUML ---
          # catalyst parses the .puml text directly and skips `!include`
          # lines, so no network is needed for the stdlib include.
          cat > test-diagrams/context.puml <<'EOF'
          @startuml
          !include https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/v2.13.0/C4_Context.puml
          Person(user, "User", "An end user")
          System(app, "App", "The system")
          Rel(user, app, "uses", "HTTPS")
          @enduml
          EOF
          cat > test-diagrams/nested/container.puml <<'EOF'
          @startuml
          !include https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/v2.13.0/C4_Container.puml
          System_Boundary(s, "System") {
            Container(api, "API", "Go", "REST API")
            ContainerDb(db, "DB", "Postgres", "Stores state")
          }
          Rel(api, db, "reads/writes", "SQL")
          @enduml
          EOF

          # --- unsupported contract: a sequence diagram alongside a valid
          # C4 file; with skip-unsupported the sequence is loudly skipped
          # and the C4 file still converts (batch exits 0). ---
          cp test-diagrams/context.puml test-mixed/context.puml
          cat > test-mixed/nested/sequence.puml <<'EOF'
          @startuml
          Alice -> Bob : hello
          Bob --> Alice : hi
          @enduml
          EOF

      - name: Supported path — valid C4 converts
        uses: ./
        with:
          input: test-diagrams
          output: test-output
          quiet: 'true'

      - name: Assert C4 converted output
        run: |
          set -euo pipefail
          for f in test-output/context.drawio test-output/nested/container.drawio; do
            test -s "$f" || { echo "FAIL: $f missing or empty"; exit 1; }
            grep -q 'mxGraphModel' "$f" || { echo "FAIL: $f missing mxGraphModel"; exit 1; }
            echo "PASS: $f"
          done

      - name: Unsupported path — sequence skipped, batch still green
        uses: ./
        with:
          input: test-mixed
          output: test-mixed-output
          skip-unsupported: 'true'
          quiet: 'true'

      - name: Assert skip-unsupported contract
        run: |
          set -euo pipefail
          # The valid C4 sibling still converted...
          test -s test-mixed-output/context.drawio \
            || { echo "FAIL: valid C4 not converted under skip-unsupported"; exit 1; }
          grep -q 'mxGraphModel' test-mixed-output/context.drawio \
            || { echo "FAIL: context.drawio missing mxGraphModel"; exit 1; }
          # ...and the sequence diagram was skipped (no stub emitted).
          if [ -e test-mixed-output/nested/sequence.drawio ]; then
            echo "FAIL: sequence.drawio should NOT exist (must be skipped, not stubbed)"
            exit 1
          fi
          echo "PASS: skip-unsupported skipped the sequence and kept the C4 file"
