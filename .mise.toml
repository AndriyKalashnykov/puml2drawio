[settings]
# Make .nvmrc the single source of truth for the Node major. mise does NOT
# read idiomatic version files (.nvmrc/.node-version) by default — it must be
# opted-in per tool. With this enabled and no `node` entry in [tools], mise
# resolves Node from .nvmrc, exactly like actions/setup-node's
# `node-version-file: '.nvmrc'`. This removes the previous dual pin
# (.nvmrc=24 AND .mise.toml node="24"), which let local mise and CI
# setup-node drift apart. Verified: `mise current node` → resolves .nvmrc.
idiomatic_version_file_enable_tools = ["node"]

[tools]
# node: NOT pinned here — comes from .nvmrc via the setting above.
# Renovate's native `mise` manager tracks the pins below automatically (it
# derives the datasource from each tool's mise backend). The `# renovate:`
# keyword form is intentionally NOT used here: the mise manager does not
# consult inline comments, and adding a custom.regex over .mise.toml would
# duplicate-PR against the native manager (see /renovate skill).
hadolint = "2.15.0"   # github: hadolint/hadolint
act = "0.2.89"        # github: nektos/act
trivy = "0.72.0"      # github: aquasecurity/trivy
shellcheck = "0.11.0" # github: koalaman/shellcheck
